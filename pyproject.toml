[tool.poetry]
name = "mocon"
version = "0.1.0"
description = "Extensible motion capture data converter - FBX to AMASS/ASAP format"
authors = ["ShiHan Wan <shihanwan@gmail.com>"]
readme = "README.md"
license = "MIT"
keywords = ["motion-capture", "fbx", "smpl", "amass", "animation", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^1.24.0"
scipy = "^1.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"
ruff = "^0.1.0"

[tool.poetry.extras]
blender = ["bpy"]
trimesh = ["trimesh"]

[tool.poetry.scripts]
mocon = "src.mocon:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
